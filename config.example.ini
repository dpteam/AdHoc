; =============================================================
;  DPT.Agent AdHoc Server - example configuration
;
;  Copy to config.ini (created automatically on first run) and
;  restart the server after editing. Encoding: UTF-8.
; =============================================================

[server]
; Ad-hoc control port the PSP / PPSSPP clients connect to.
adhocPort=27312
; Tried in order when the main port is already taken.
adhocPortFallbacks=27313,27314
listenBacklog=128
maxUsers=256
maxUsersPerIp=16
; Drop a session that has not sent anything for this long (PPSSPP pings every 2s).
userTimeoutSec=25
sendTimeoutMs=5000
readTimeoutMs=1000
; Hard session lifetime in hours, 0 = unlimited.
sessionMaxHours=12
; Keep empty games on the board for this long, in minutes.
emptyGameTtlMin=15
; Tolerant mode: skip unknown opcodes instead of killing the session.
ignoreUnknownOpcodes=true
; Games identify players by MAC; set true to kick the older duplicate.
kickDuplicateMac=false
requireValidProductCode=true
shutdownMessage=ADHOC SERVER IS SHUTTING DOWN!

[web]
port=8080
portFallbacks=8081,8082,8083,8084,8085
; 0.0.0.0 = доступно в локальной сети, 127.0.0.1 = только этот компьютер
bindAddress=0.0.0.0
compress=true
requestsPerMinute=600
maxConcurrentRequests=32
exposeLogs=true
; When set, POST endpoints and the log viewer require header X-Admin-Token
adminToken=
defaultTheme=light
defaultSound=true
refreshMs=2000
webRoot=public

[limits]
maxFailedLoginsPerIp=20
banSeconds=120
historySize=300
eventSize=400
logRingSize=1500
maxPacketBuffer=4096

[logging]
dir=logs
; Error | Warn | Info | Debug | Verbose
level=Info
protocolTrace=true
maxFileMB=8
retentionDays=14

[ui]
noConsoleStatusLine=false